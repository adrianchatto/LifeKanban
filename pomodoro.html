<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pomodoro - LifeKanban</title>
<link rel="stylesheet" href="/theme.css">
<style>
:root{--bg:#f5f6f8;--panel:#fff;--text:#111827;--muted:#6b7280;--line:#dfe4ee;--accent:#2563eb;--accent-soft:#eaf1ff;--good:#16a34a;--warn:#d97706;--shadow:0 18px 48px rgba(15,23,42,.12)}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer}.shell{min-height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 18px)}.top{display:flex;align-items:center;gap:12px;min-height:44px}.back,.icon-btn{border:1px solid var(--line);background:rgba(255,255,255,.86);color:var(--text);height:42px;border-radius:14px;padding:0 14px;text-decoration:none;font-weight:750;box-shadow:0 1px 2px rgba(15,23,42,.04)}.back{display:inline-flex;align-items:center}.title{min-width:0;flex:1}.title h1{margin:0;font-size:22px;line-height:1.12;letter-spacing:0}.title p{margin:2px 0 0;color:var(--muted);font-size:13px}.timer{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;width:min(680px,100%);margin:0 auto}.mode-card{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow)}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#eef1f6;border:1px solid var(--line);border-radius:16px;padding:4px}.tabs button{border:0;background:transparent;border-radius:12px;height:42px;color:#667085;font-weight:800}.tabs button.active{background:var(--panel);color:var(--text);box-shadow:0 1px 4px rgba(15,23,42,.10)}.face{display:grid;place-items:center;text-align:center;padding:28px 0 18px}.time{font-size:clamp(64px,24vw,128px);font-weight:850;letter-spacing:0;font-variant-numeric:tabular-nums;line-height:.92}.label{margin-top:10px;color:var(--muted);font-weight:750}.ring{width:min(78vw,330px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;margin:0 auto 6px;background:conic-gradient(var(--accent) calc(var(--progress,0)*1%),#edf1f7 0);box-shadow:inset 0 0 0 1px var(--line)}.ring-inner{width:calc(100% - 22px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--panel)}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary,.secondary{height:54px;border-radius:16px;border:1px solid var(--line);font-weight:850}.primary{border-color:var(--accent);background:var(--accent);color:#fff}.secondary{background:var(--panel);color:var(--text)}.utility{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.utility button{height:46px;border-radius:15px;border:1px solid var(--line);background:var(--panel);color:#344054;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:18px;padding:13px 12px}.stat span{display:block;color:var(--muted);font-size:12px;font-weight:750}.stat strong{display:block;margin-top:3px;font-size:20px;letter-spacing:0}.settings{display:none;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 8px 26px rgba(15,23,42,.08)}.settings.open{display:block}.field{display:grid;grid-template-columns:1fr 94px;gap:12px;align-items:center;margin:0 0 12px}.field label{color:#344054;font-weight:800}.field input{height:42px;border:1px solid var(--line);border-radius:12px;padding:0 10px;background:#fbfcfe;color:var(--text)}.wide{grid-template-columns:1fr}.wide input{width:100%}.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 12px;color:#344054;font-weight:800}.toggle input{width:22px;height:22px}.save{width:100%;height:48px;border-radius:15px;border:0;background:#111827;color:#fff;font-weight:850}.note{color:var(--muted);font-size:12px;text-align:center;margin:0 6px}.running .ring{animation:pulse 2.6s ease-in-out infinite}@keyframes pulse{0%,100%{filter:saturate(1)}50%{filter:saturate(1.18) brightness(1.02)}}@media(min-width:760px){.shell{padding:24px}.timer{justify-content:flex-start;padding-top:28px}.mode-card{padding:24px}.controls,.utility{width:min(520px,100%);margin:0 auto}.stats{width:min(520px,100%);margin:0 auto}.settings{width:min(520px,100%);margin:0 auto}}@media(max-width:420px){.shell{padding-left:12px;padding-right:12px}.top{gap:8px}.back,.icon-btn{height:40px;border-radius:13px;padding:0 11px}.title h1{font-size:20px}.title p{display:none}.mode-card{border-radius:22px;padding:14px}.time{font-size:clamp(58px,23vw,92px)}.controls{grid-template-columns:1fr}.utility{grid-template-columns:1fr 1fr}.utility button:last-child{grid-column:1/-1}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}}
</style>
</head>
<body>
<div class="shell" id="app">
  <header class="top">
    <a class="back" href="/?desktop=1" id="boardLink">Board</a>
    <div class="title"><h1>Pomodoro</h1><p>Focus timer tuned for mobile.</p></div>
    <button class="icon-btn" id="settingsBtn" type="button" aria-label="Settings">Settings</button>
  </header>
  <main class="timer">
    <section class="mode-card">
      <div class="tabs" role="tablist" aria-label="Timer mode">
        <button type="button" data-mode="focus">Focus</button>
        <button type="button" data-mode="short">Short</button>
        <button type="button" data-mode="long">Long</button>
      </div>
      <div class="face">
        <div class="ring" id="ring"><div class="ring-inner"><div><div class="time" id="time">25:00</div><div class="label" id="label">Ready to focus</div></div></div></div>
      </div>
      <div class="controls">
        <button class="primary" id="startBtn" type="button">Start</button>
        <button class="secondary" id="resetBtn" type="button">Reset</button>
      </div>
    </section>
    <section class="utility" aria-label="Timer actions">
      <button type="button" id="skipBtn">Skip</button>
      <button type="button" id="musicBtn">Music</button>
      <button type="button" id="fullBtn">Full board</button>
    </section>
    <section class="stats" aria-label="Pomodoro stats">
      <div class="stat"><span>Sessions</span><strong id="count">0</strong></div>
      <div class="stat"><span>Mode</span><strong id="modeName">Focus</strong></div>
      <div class="stat"><span>Length</span><strong id="length">25m</strong></div>
    </section>
    <section class="settings" id="settingsPanel" aria-label="Pomodoro settings">
      <div class="field"><label for="focusMin">Focus minutes</label><input id="focusMin" type="number" min="1" max="240"></div>
      <div class="field"><label for="shortMin">Short break</label><input id="shortMin" type="number" min="1" max="120"></div>
      <div class="field"><label for="longMin">Long break</label><input id="longMin" type="number" min="1" max="180"></div>
      <label class="toggle"><span>Open music on focus start</span><input id="spotifyFocus" type="checkbox"></label>
      <div class="field wide"><label for="spotifyUrl">Music URL</label><input id="spotifyUrl" type="url" inputmode="url" placeholder="https://open.spotify.com/..."></div>
      <button class="save" id="saveBtn" type="button">Save settings</button>
    </section>
    <p class="note">This page shares the same Pomodoro state as the desktop board.</p>
  </main>
</div>
<script>
(function(){
  "use strict";
  var KEY="kanban_pomodoro";
  var DEF={focus:25,short:5,long:15,mode:"focus",remaining:25*60,running:false,last:0,count:0,spotifyUrl:"",spotifyFocus:false};
  var names={focus:"Focus",short:"Short",long:"Long"};
  var st=load();
  var app=document.getElementById("app"), ring=document.getElementById("ring"), time=document.getElementById("time"), label=document.getElementById("label"), startBtn=document.getElementById("startBtn"), count=document.getElementById("count"), modeName=document.getElementById("modeName"), lengthEl=document.getElementById("length"), settings=document.getElementById("settingsPanel");
  var tabs=[].slice.call(document.querySelectorAll("[data-mode]"));
  var focusMin=document.getElementById("focusMin"), shortMin=document.getElementById("shortMin"), longMin=document.getElementById("longMin"), spotifyUrl=document.getElementById("spotifyUrl"), spotifyFocus=document.getElementById("spotifyFocus");
  function clamp(n,min,max){ n=parseInt(n,10); if(!Number.isFinite(n)) n=min; return Math.max(min,Math.min(max,n)); }
  function duration(mode){ return Math.max(1,parseInt(st[mode]||DEF[mode],10))*60; }
  function load(){ try{ return Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||"{}")); }catch(e){ return Object.assign({},DEF); } }
  function save(){ localStorage.setItem(KEY,JSON.stringify(st)); }
  function fmt(sec){ sec=Math.max(0,Math.ceil(sec)); var m=Math.floor(sec/60), s=sec%60; return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"); }
  function openMusic(auto){ var url=(st.spotifyUrl||"").trim(); if(!url) return; if(auto && !st.spotifyFocus) return; try{ window.open(url,"_blank","noopener"); }catch(e){} }
  function notify(title,body){ try{ if(window.Notification && Notification.permission==="granted") new Notification(title,{body:body}); }catch(e){} }
  function switchMode(mode, keepRunning){ st.mode=mode; st.remaining=duration(mode); st.running=!!keepRunning; st.last=Date.now(); save(); render(); }
  function finish(){ if(st.mode==="focus"){ st.count=(st.count||0)+1; notify("Focus complete","Time for a break."); switchMode(st.count%4===0?"long":"short", false); } else { notify("Break complete","Ready for the next focus block."); switchMode("focus", false); } }
  function tick(){ if(!st.running) return; var now=Date.now(); var elapsed=Math.max(0,(now-(st.last||now))/1000); st.last=now; st.remaining-=elapsed; if(st.remaining<=0){ st.remaining=0; st.running=false; finish(); } else { save(); render(); } }
  function render(){
    var total=duration(st.mode), pct=total?((total-Math.max(0,st.remaining))/total*100):0;
    time.textContent=fmt(st.remaining); ring.style.setProperty("--progress",pct.toFixed(3));
    label.textContent=st.running ? (names[st.mode]+" in progress") : (st.mode==="focus"?"Ready to focus":"Break ready");
    startBtn.textContent=st.running?"Pause":"Start"; app.classList.toggle("running",!!st.running);
    tabs.forEach(function(b){ b.classList.toggle("active",b.dataset.mode===st.mode); });
    count.textContent=st.count||0; modeName.textContent=names[st.mode]||"Focus"; lengthEl.textContent=Math.round(total/60)+"m";
    focusMin.value=st.focus; shortMin.value=st.short; longMin.value=st.long; spotifyUrl.value=st.spotifyUrl||""; spotifyFocus.checked=!!st.spotifyFocus;
  }
  tabs.forEach(function(b){ b.addEventListener("click",function(){ switchMode(b.dataset.mode,false); }); });
  startBtn.addEventListener("click",function(){ if(!st.running){ try{ if(window.Notification && Notification.permission==="default") Notification.requestPermission(); }catch(e){} st.last=Date.now(); openMusic(true); } st.running=!st.running; st.last=Date.now(); save(); render(); });
  document.getElementById("resetBtn").addEventListener("click",function(){ st.running=false; st.remaining=duration(st.mode); save(); render(); });
  document.getElementById("skipBtn").addEventListener("click",function(){ finish(); });
  document.getElementById("musicBtn").addEventListener("click",function(){ openMusic(false); });
  document.getElementById("settingsBtn").addEventListener("click",function(){ settings.classList.toggle("open"); });
  document.getElementById("fullBtn").addEventListener("click",function(){ sessionStorage.setItem("kanban_desktop_board","1"); location.href="/?desktop=1"; });
  document.getElementById("boardLink").addEventListener("click",function(){ sessionStorage.setItem("kanban_desktop_board","1"); });
  document.getElementById("saveBtn").addEventListener("click",function(){ st.focus=clamp(focusMin.value,1,240); st.short=clamp(shortMin.value,1,120); st.long=clamp(longMin.value,1,180); st.spotifyUrl=spotifyUrl.value.trim(); st.spotifyFocus=!!spotifyFocus.checked; if(!st.running) st.remaining=duration(st.mode); save(); settings.classList.remove("open"); render(); });
  render(); setInterval(tick,250);
})();
</script>
</body>
</html>
